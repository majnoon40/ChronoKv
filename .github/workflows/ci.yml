# ChronoKV CI — two-file project (chronokv.hpp + main.cpp), so every job is:
#   checkout -> make <target> -> run the test binary (exit code 0 = pass).
#
# v25.2 matrix (expanded):
#   hooks-on:  release (g++-13 / g++-14 / clang++-18), asan (ASan+UBSan),
#              stress, and ONE tsan job running the FULL suite (the former
#              3-batch split was removed — see Makefile/main.cpp).
#              Plus:
#                - release (g++-12) on ubuntu-22.04: older kernel (5.15) +
#                  older compiler — exercises the io_uring feature-ladder
#                  fallbacks (no COOP_TASKRUN pre-5.19) and g++-12
#                  portability, the class of bug the g++-13 fix found.
#                - release with CKV_IOURING_DISABLED: proves the sync
#                  pwrite+fsync fallback build stays green when a container
#                  blocks io_uring (the documented compile-out path).
#   hooks-off: public-API smoke across release / asan / tsan / stress —
#              proves the header works with no test hooks defined, i.e.
#              how a real user consumes it.
#   v27 M2:    two dedicated seeded jobs, bounded on push/PR and long on
#              the nightly schedule / manual dispatch:
#                - crashfuzz: just the v26 M2 crash-fuzz regime via the
#                  CKV_ONLY_CRASHFUZZ gate, scaled by CKV_CRASHFUZZ_SEEDS
#                  (N seed bases per run, base derived from the run id and
#                  echoed to the log for deterministic replay).
#                - dst: the v27 M0 deterministic-scheduler harness (the
#                  real DST runner — M0 shipped at 0.26.3): N seeds per
#                  scenario via CKV_DST_SEEDS, fork-isolated, replayable
#                  from (seed, op-count). Complemented by the seeded
#                  regimes the M2 placeholder introduced: full suite under
#                  CHRONOKV_STRESS across interleaving seeds
#                  (CKV_STRESS_SEED, echoed) and the lincheck engine
#                  workload at CKV_LINCHECK_SEEDS=N.
#   v27 M3:    `coverage` — gcov build + per-fault-kind forced runs
#              (CKV_COVERAGE_FAULT), publishing per-kind error-path
#              coverage, unique per-kind contributions, vacuous-kind
#              fire counts, and the ledger of error-path lines no run
#              reaches (bounded PR vehicle: review gate; nightly: full
#              suite per kind + unforced headline run).
#   gate:      ci-passed aggregates every job — a single required check
#              for branch protection.
#   v29 CI:    - `lint`: seconds-long -fsyntax-only gates (the project's WARN
#                set as -Werror on g++, header + test suite, hooks on/off; a
#                -Wconversion count ratchet, scripts/lint_wconversion.sh;
#                clang++-18 -Werror as an informational step; header hygiene:
#                re-include in one TU + a 2-TU link).
#              - `build-shared`: the stress and release binaries are compiled
#                ONCE per run and handed to `dst` (8 nightly shards) and
#                `crashfuzz` as artifacts instead of each re-compiling the one
#                large translation unit.
#              - promoted sanitizer legs (2026-10-07): the io_uring-disabled
#                asan/tsan builds (the only config where the WAL write-path
#                fault legs run) and clang asan/tsan shipped as
#                `experimental: true` (non-blocking until green once); runs
#                #64/#65/#66 made each green three times — the promotion
#                condition in the original comment — so the flags were
#                deleted and all four legs now GATE via ci-passed.
#
# io_uring: every default build attempts real io_uring. The test binary
# probes the ring at runtime, prints the feature summary
# (coop_taskrun / fixed_buf / fixed_files / deadline), runs the mock-backed
# state-machine tests, and runs the real-kernel end-to-end test when the
# ring is available (SKIP otherwise).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # v27 M2: nightly long-run config. schedule (and manual dispatch) scale
  # the dst/crashfuzz jobs up; push/PR keep the bounded configs so the
  # per-PR runtime stays where it was before this milestone.
  schedule:
    - cron: '17 3 * * *'

# Least-privilege token: no job in this workflow needs write access.
permissions:
  contents: read

# v27 M2: push/PR runs share a per-ref group and supersede each other
# (unchanged behavior), but nightly/dispatch runs get a run-scoped group
# and are never cancelled — a push landing mid-nightly must not kill the
# long seed sweep halfway through.
concurrency:
  group: ci-${{ github.ref }}-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.run_id || 'shared' }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  # ---- v29: fast static gates -----------------------------------------------
  lint:
    name: lint (-Werror, -Wconversion ratchet, header hygiene)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Warnings as errors (g++; header + test suite; hooks on/off)
        run: make lint-werror

      - name: -Wconversion ratchet (warning count may not grow)
        run: make lint-conversion

      # clang's -Wall -Wextra set differs from g++'s. This leg was
      # informational (continue-on-error) until 2026-10-11, when the
      # standing warnings were fixed verified on clang-18 18.1.8 (CI runs
      # 18.1.3): the four hooks-off header errors — 3x
      # -Wunused-lambda-capture (the async wrappers' rec_t0, captured
      # unconditionally while its only uses sit under CHRONOKV_TEST_HOOKS)
      # and 1x -Wunused-private-field (ReadWriteTransaction::rec_txn_id_,
      # whose both consumers are hooks-gated; the chronokv::Transaction
      # wrapper's own rec_txn_id_ was ALREADY gated — same v27 M1 feature,
      # the RWT copy was the oversight) — were fixed by gating each
      # declaration/capture exactly like its consumers. That unmasked
      # THREE more in the suite pass (make stops at the first failing
      # pass, so the recorded "4 errors" had never seen passes 2-4):
      # -Wmisleading-indentation in the ckpt corruptor's case-0 one-liner
      # (braced the loop body; semantics unchanged), an unused `t` capture
      # in the v21 retry test, and a constexpr `OPS` capture the
      # constant-expression use never required. The leg is now gating.
      - name: Warnings as errors (clang++-18)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18
          make lint-werror CXX=clang++-18

      # Header hygiene (audit API-1): the "single header" must be includable
      # twice in one TU and from two TUs linked together (#pragma once + inline
      # statics). Gating since the audit-2 fixes.
      - name: Header hygiene, re-include in one TU
        run: make lint-header-reinclude

      - name: Header hygiene, two TUs link
        run: make lint-header-2tu

  # ---- hooks-on: full internal test suite --------------------------------
  engine-tests:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: release (g++-13)
            os: ubuntu-24.04
            target: release
            bin: build/release/test
            cxx: g++
            # v26 M2: this job carries the heavy crash-fuzz run (40 rounds
            # x 26 points = 1040 iterations vs the in-suite default of 312;
            # the "800 vs 240" figures that stood here were stale pre-v25.8
            # 20-point math). Kept to one job so the sanitizer and TSan
            # jobs -- where fork+recovery costs far more -- stay fast.
            # v27 M2: SEED scaling lives in the dedicated `crashfuzz` job.
            crashfuzz_rounds: 40
          - name: release (g++-14)
            os: ubuntu-24.04
            target: release
            bin: build/release/test
            cxx: g++-14
            install: g++-14
          - name: release (clang++-18)
            os: ubuntu-24.04
            target: release
            bin: build/release/test
            cxx: clang++-18
            install: clang-18
          - name: asan+ubsan
            os: ubuntu-24.04
            target: asan
            bin: build/asan/test
            cxx: g++
          - name: stress
            os: ubuntu-24.04
            target: stress
            bin: build/stress/test
            cxx: g++
          # Older kernel (5.15) + older default compiler: exercises the
          # io_uring fallback ladder (no COOP_TASKRUN) and g++-12
          # portability in one job.
          - name: release (g++-12, ubuntu-22.04)
            os: ubuntu-22.04
            target: release
            bin: build/release/test
            cxx: g++
          # Compile-out path for seccomp-confined containers: the sync
          # pwrite+fsync fallback must stay fully functional.
          - name: release (io_uring disabled)
            os: ubuntu-24.04
            target: release
            bin: build/release/test
            cxx: g++
            extra_defs: -DCKV_IOURING_DISABLED
          # ---- v29 sanitizer legs (PROMOTED to gating 2026-10-07) ----
          # Shipped as experimental (non-blocking until green once); green
          # three runs straight (#64/#65/#66) — the promotion condition —
          # so the flags were deleted. The io_uring-disabled build is the
          # ONLY configuration where the WAL write-path fault legs
          # (pwrite_all WriteShort/WriteFail, D2 async-write-stage) run —
          # they SKIP on native io_uring builds — and until 0.28.1 it ran
          # in release only. Under ASan+UBSan those error paths also get
          # leak/UB checking. (crash-injection stays skipped under every
          # sanitizer: fork is unreliable there, a property of the build,
          # not of CI config.)
          - name: asan+ubsan (io_uring disabled)
            os: ubuntu-24.04
            target: asan
            bin: build/asan/test
            cxx: g++
            extra_defs: -DCKV_IOURING_DISABLED
          # clang's sanitizer runtime and codegen differ from gcc's.
          - name: asan+ubsan (clang++-18)
            os: ubuntu-24.04
            target: asan
            bin: build/asan/test
            cxx: clang++-18
            install: clang-18
    steps:
      - uses: actions/checkout@v5

      - name: Install compiler
        # `matrix.install` is null for entries that don't define it; a truthy
        # test is unambiguous, whereas `!= ''` relies on GitHub's
        # null-vs-empty-string coercion.
        if: ${{ matrix.install }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.install }}

      - name: Build
        run: make -j4 ${{ matrix.target }} CXX=${{ matrix.cxx }} CKV_EXTRA_DEFS='${{ matrix.extra_defs }}'

      - name: Run tests
        env:
          # Empty for matrix entries that don't set it; the test binary treats
          # an unset-or-zero value as "use the built-in default".
          CKV_CRASHFUZZ_ROUNDS: ${{ matrix.crashfuzz_rounds }}
        run: |
          set -o pipefail
          ./${{ matrix.bin }} 2>&1 | tee test.log

      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-log-engine-${{ strategy.job-index }}-${{ matrix.target }}
          path: test.log
          if-no-files-found: ignore

  # ---- hooks-on: TSan, the FULL suite as a single job (v25.2) ------------
  # The former 3-batch split (CHRONOKV_TSAN_BATCH 1/2/3) was removed from
  # main.cpp and the Makefile; one job now covers everything.
  tsan:
    name: tsan (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # v29 M4 follow-up (2026-10-20, run 39468873357): the page-latch
      # role-flip artifact — M4's slot reuse makes a never-erased
      # LatchTable rwlock identity play both tree roles over time, which
      # TSan's lock-order graph stitches into false "potential deadlock"
      # cycles (and forked children exit 66 on the report, failing checks
      # they passed). Narrow deadlock:-type suppression — data races stay
      # at full strength; full argument + residual blind spot in the file.
      TSAN_OPTIONS: suppressions=docs/tsan.supp
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: full suite
            cxx: g++
          # v29 legs (PROMOTED to gating 2026-10-07 after #64/#65/#66 —
          # green three runs straight): the io_uring-disabled build (WAL
          # write-path fault legs under TSan) and clang's TSan runtime
          # (different instrumentation than gcc's).
          - name: full suite, io_uring disabled
            cxx: g++
            extra_defs: -DCKV_IOURING_DISABLED
          - name: full suite, clang++-18
            cxx: clang++-18
            install: clang-18
    steps:
      - uses: actions/checkout@v5

      - name: Install compiler
        if: ${{ matrix.install }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.install }}

      - name: Build
        run: make -j4 tsan CXX=${{ matrix.cxx }} CKV_EXTRA_DEFS='${{ matrix.extra_defs }}'

      - name: Run tests
        run: |
          set -o pipefail
          ./build/tsan/test 2>&1 | tee test.log

      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-log-tsan-${{ strategy.job-index }}
          path: test.log
          if-no-files-found: ignore

  # ---- hooks-off: public-API smoke, no test hooks -------------------------
  public-api-smoke:
    name: smoke (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Ignored by the non-TSan legs; the tsan leg carries the same
      # page-latch role-flip suppression as the full-suite tsan job
      # (docs/tsan.supp — argument and blind spot recorded there).
      TSAN_OPTIONS: suppressions=docs/tsan.supp
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: release
            target: smoke_off_release
            bin: build/smoke_off/release/test
          - name: asan+ubsan
            target: smoke_off_asan
            bin: build/smoke_off/asan/test
          - name: tsan
            target: smoke_off_tsan
            bin: build/smoke_off/tsan/test
          - name: stress
            target: smoke_off_stress
            bin: build/smoke_off/stress/test
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: make -j4 ${{ matrix.target }}

      - name: Run tests
        run: |
          set -o pipefail
          ./${{ matrix.bin }} 2>&1 | tee test.log

      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-log-smoke-${{ matrix.name }}
          path: test.log
          if-no-files-found: ignore

  # ---- v29: shared binaries ---------------------------------------------------
  # The test suite is four translation units (v29 M2 item 5), but every one
  # of them recompiles the ~13.5k-line engine header, so a full build is
  # still minutes of CPU — and before this job every consumer compiled its
  # own copy: each of the 8 nightly DST shards rebuilt `stress`, and
  # `release` was rebuilt again for crashfuzz and the lincheck leg. Now each
  # is built once per run (make -j4 over the four TUs) and handed on as an
  # artifact. (ccache would not help: any header change invalidates every
  # TU.) The binaries bake in the checkout path via
  # CHRONOKV_SOURCE_DIR, identical on every runner of this repo, and consumers
  # still run actions/checkout so the sources exist at that path.
  build-shared:
    name: build (${{ matrix.target }}, shared)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [stress, release]
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: make -j4 ${{ matrix.target }}

      - name: Upload binary
        uses: actions/upload-artifact@v5
        with:
          name: bin-${{ matrix.target }}
          path: build/${{ matrix.target }}/test
          retention-days: 1
          overwrite: true
          if-no-files-found: error

  # ---- v27 M2: dedicated crash-fuzz job (N seeds) --------------------------
  # Scales the v26 M2 crash-fuzz regime by SEEDS, independently of the
  # full-suite jobs: push/PR run a bounded config (2 bases x 24 rounds x 26
  # points = 1248 plans); the nightly schedule and manual dispatch run the
  # long config (8 bases x 120 rounds = 24,960 plans). The base seed derives
  # from github.run_id so every run explores fresh plan space, and the
  # binary echoes the full config + every base to the log — a failing plan
  # replays deterministically with CKV_CRASHFUZZ_SEED/SEEDS/ROUNDS from the
  # log alone (the v27 reproducibility contract). Failure scenes the binary
  # preserves under /tmp/ckv_cf_* are collected into the workspace and
  # uploaded with the log.
  crashfuzz:
    name: crashfuzz (N seeds)
    needs: build-shared
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ fromJSON((github.event_name == 'push' || github.event_name == 'pull_request') && '30' || '150') }}
    steps:
      - uses: actions/checkout@v5

      - name: Download shared release binary
        uses: actions/download-artifact@v5
        with:
          name: bin-release
          path: build/release

      - name: Make binary executable
        run: chmod +x build/release/test

      - name: Run crash-fuzz (bounded PR / long nightly)
        env:
          CKV_ONLY_CRASHFUZZ: "1"
          CKV_CRASHFUZZ_SEED: ${{ github.run_id }}
          CKV_CRASHFUZZ_SEEDS: ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && '2' || '8' }}
          CKV_CRASHFUZZ_ROUNDS: ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && '24' || '120' }}
        run: |
          set -o pipefail
          ./build/release/test 2>&1 | tee crashfuzz.log

      - name: Collect preserved crash scenes
        if: failure()
        run: mkdir -p scenes && cp -r /tmp/ckv_cf_* scenes/ 2>/dev/null || true

      - name: Upload crash-fuzz artifacts
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: crashfuzz-run-${{ github.run_id }}
          path: |
            crashfuzz.log
            scenes/
          if-no-files-found: ignore

  # ---- v27 M2+M0: dst job (N seeds) ----------------------------------------
  # The roadmap names this job `dst`. As of 0.26.3 it runs the REAL v27 M0
  # deterministic-scheduler harness (the M2 placeholder regimes stay as
  # complementary coverage):
  #   1. DST HARNESS (primary): six fork-isolated scenarios over the three
  #      bug-dense areas + the two historical anchors (wal_mixed_handoff =
  #      H3 class, wal_leader_fault = C1 class, gc_epoch_scan,
  #      tree_cursor_split) + the two v29-M2-item-2 grammar scenarios
  #      written BEFORE the code they gate (tree_merge_cascade = M4's
  #      merge/rebalance/cascade, reclaim_retire_pin = M3's
  #      reclamation/retirement), N seeds each — push/PR: 100 (single
  #      shard); nightly/dispatch: 8 shards x 2,083 = 16,664 per scenario
  #      (x 6 scenarios = 99,984 scenario-runs ≈ the roadmap's N=100k;
  #      the per-shard seed count was rebalanced from 3,125 when item 2
  #      grew the grammar 4 -> 6 so the per-shard child count — and with
  #      it the wall-time band — stays at ~12.5k), sharded because a
  #      single job measured ~225 min at that scale vs the 240-min
  #      timeout, and 8-way because runner variance gave one 4-way shard
  #      2h15m+ while its siblings finished in ~50 min. Failures
  #      print (scenario, seed, op-count, last point): the replay handle.
  #      Acceptance was proven by reintroducing C1 (hang, caught on >=3/10
  #      seeds per run) and H3 (SEGV, caught on 12/12 seeds) — see the
  #      0.26.3 notes in docs/ROADMAP.md.
  #   2. the FULL suite under CHRONOKV_STRESS (seeded sparse yields at the
  #      race windows) across N interleaving seeds — push/PR: seed 7;
  #      nightly/dispatch: seeds 7, 21, 42. CKV_STRESS_SEED is echoed by
  #      the binary, so any run replays from its log.
  #   3. the lincheck engine workloads at CKV_LINCHECK_SEEDS=N — push/PR:
  #      4 seeds; nightly/dispatch: 64. Each seed's history must pass every
  #      checker and be non-vacuous.
  dst:
    name: dst (N seeds, shard ${{ matrix.shard }})
    needs: build-shared
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ fromJSON((github.event_name == 'push' || github.event_name == 'pull_request') && '60' || '240') }}
    # v26.3-review-era fix: the nightly 100k-seed DST sweep measured
    # ~135 ms/seed on runners (run #15: 400 seeds in 54 s) — ~225 min in a
    # SINGLE job against a 240-min timeout. 0.27.0 hardening: 8 shards x
    # 3,125 (was 4 x 6,250) after run #17 showed the runner-variance tail —
    # three shards finished in 49-58 min while one identical-code shard
    # ground past 2h15m on a slow node. Smaller shards halve the bad-node
    # worst case; push/PR stay single-shard and bounded.
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON((github.event_name == 'push' || github.event_name == 'pull_request') && '[0]' || '[0,1,2,3,4,5,6,7]') }}
    steps:
      - uses: actions/checkout@v5

      - name: Download shared stress binary
        uses: actions/download-artifact@v5
        with:
          name: bin-stress
          path: build/stress

      # shard 0 also runs the lincheck leg, which uses the release binary.
      - name: Download shared release binary (shard 0)
        if: matrix.shard == 0
        uses: actions/download-artifact@v5
        with:
          name: bin-release
          path: build/release

      - name: Make binaries executable
        run: chmod +x build/*/test

      - name: DST harness, N seeds per scenario (bounded PR / sharded nightly)
        env:
          CKV_ONLY_DST: "1"
          # Nightly: 8 shards x 2,083 = 16,664 seeds per scenario x 6
          # scenarios = 99,984 scenario-runs ≈ the roadmap's N=100k
          # (rebalanced from 8 x 3,125 x 4 when v29 M2 item 2 grew the
          # grammar to six scenarios — per-shard child count stays
          # ~12.5k, preserving the wall-time band). Shard bases are 911 +
          # shard*1000003 (literal table — the expression lexer rejects
          # inline '+'); the binary's per-scenario seed offset is a
          # multiple of the same prime and the per-seed step is a larger
          # prime, so shards are provably disjoint within each scenario
          # (the argument needs seeds-per-shard < 1000003; 2,083 keeps
          # it with the same margin as 3,125 did).
          CKV_DST_SEED: ${{ fromJSON('[911, 1000914, 2001817, 3002720, 4003623, 5004526, 6005429, 7006332]')[matrix.shard] }}
          CKV_DST_SEEDS: ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && '100' || '2083' }}
        run: |
          set -o pipefail
          ./build/stress/test 2>&1 | tee dst-seeds-shard${{ matrix.shard }}.log

      # The complementary M2 regimes run once, on shard 0 (no reason to
      # multiply the stress-suite/lincheck cost by the shard count).
      - name: Stress full suite across interleaving seeds (bounded PR / long nightly)
        if: matrix.shard == 0
        env:
          STRESS_SEEDS: ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && '7' || '7 21 42' }}
        run: |
          set -o pipefail
          for s in $STRESS_SEEDS; do
            echo "=== stress full suite, seed $s ==="
            CKV_STRESS_SEED=$s ./build/stress/test 2>&1 | tee stress-$s.log
          done

      - name: Lincheck engine workload, N seeds (bounded PR / long nightly)
        if: matrix.shard == 0
        env:
          CKV_ONLY_LINCHECK: "1"
          CKV_LINCHECK_SEEDS: ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && '4' || '64' }}
        run: |
          set -o pipefail
          ./build/release/test 2>&1 | tee lincheck-seeds.log

      - name: Upload dst logs
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: dst-run-${{ github.run_id }}-shard-${{ matrix.shard }}
          path: |
            dst-seeds-shard*.log
            stress-*.log
            lincheck-seeds.log
          if-no-files-found: ignore

  # ---- v27 M3: coverage aimed at error paths ------------------------------
  # gcov-instrumented build + one forced-fault run PER fault kind
  # (CKV_COVERAGE_FAULT=<Kind> fires that kind at EVERY site for the whole
  # run, independent of the suite's own arm/disarm windows), analyzed by
  # scripts/fault_coverage.py, which publishes: per-run line counts/%,
  # per-kind error-path lines and their UNIQUE contributions (the
  # roadmap's per-fault-kind number), forced-fire counts (a kind that
  # fires 0 times is flagged VACUOUS for that vehicle — measured:
  # OpenFail/DirFsyncFail never fire under the review-gate vehicle because
  # their sites live in checkpoint paths the gate does not enter), and the
  # ledger of error-path lines NO run reached — the untested lines where
  # C1/H3/H1/H2 once lived.
  # Vehicle: push/PR run each kind over the review-regression gate
  # (CKV_ONLY_REVIEW: review + durability + crash-fuzz — the error-path-
  # dense subset, ~25 s/kind measured locally); nightly/dispatch switch to
  # the FULL suite per kind (which owns the checkpoint paths) plus an
  # unforced full-suite run for the headline number.
  # NIGHTLY-VEHICLE REALITY (dispatch runs #20/#21, fixed same-day): the
  # full suite was never designed to survive EVERY fault on at once — six
  # of eight kinds die within seconds (terminate from escaping async
  # fut.get() rethrows / stoi cascades, or signals). Two fixes: (1) death
  # hooks with a STRONG __gcov_dump reference under -DCKV_COVERAGE_BUILD
  # (a weak undefined symbol never binds against static libgcov.a — run
  # #21's silent no-dump) save counters on terminate AND fatal signals;
  # (2) the nightly vehicle is TWO-STAGE per kind: review gate first
  # (survives all 8), then best-effort full suite — libgcov merges both
  # into one .gcda, so every kind keeps at least gate depth and gains
  # full-suite depth wherever it survives. Hardening the suite's escape
  # points so all eight kinds run full-suite-deep remains documented
  # ROADMAP follow-up work.
  # Suite verdicts under forcing are IGNORED (`|| true`: engines fail-stop,
  # so failing checks are the expected outcome); what a run must produce is
  # gcov data — the analyze step hard-fails only if a kind produced none.
  coverage:
    name: coverage (error paths, per fault kind)
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ fromJSON((github.event_name == 'push' || github.event_name == 'pull_request') && '60' || '240') }}
    steps:
      - uses: actions/checkout@v5

      - name: Build (gcov-instrumented)
        run: make -j4 coverage

      - name: Per-fault-kind forced runs (bounded PR vehicle / nightly full suite)
        run: |
          set -u
          mkdir -p cov
          NIGHTLY=0
          case "${{ github.event_name }}" in schedule|workflow_dispatch) NIGHTLY=1;; esac
          for k in FsyncFail WriteFail WriteShort RenameFail OpenFail DirFsyncFail SegOpenFail FsyncFailAfterPersist; do
            find build/coverage -name '*.gcda' -delete
            mkdir -p cov/$k
            if [ "$NIGHTLY" = 1 ]; then
              # Two-stage vehicle: the error-path-dense review gate FIRST
              # (proven to survive all 8 kinds), then the best-effort FULL
              # suite. libgcov MERGES counters into the same .gcda, so the
              # capture is the union of both depths — every kind keeps at
              # least gate depth even when the full suite dies early under
              # global forcing (run #21: six of eight kinds died in ~1.5 s).
              CKV_COVERAGE_FAULT=$k CKV_ONLY_REVIEW=1 ./build/coverage/test > cov/$k/run.log 2>&1 || true
              CKV_COVERAGE_FAULT=$k ./build/coverage/test > cov/$k/run-full.log 2>&1 || true
            else
              CKV_COVERAGE_FAULT=$k CKV_ONLY_REVIEW=1 ./build/coverage/test > cov/$k/run.log 2>&1 || true
            fi
            rm -f ./*.gcov
            gcov build/coverage/*.gcda > /dev/null 2>&1 || true
            mv -f ./*.gcov cov/$k/ 2>/dev/null || true
            grep -h 'coverage-fault' cov/$k/run.log || echo "::warning::no forced-fire report for $k"
          done

      - name: Unforced full-suite run (headline coverage number)
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: |
          find build/coverage -name '*.gcda' -delete
          mkdir -p cov/full
          ./build/coverage/test > cov/full/run.log 2>&1 || true
          rm -f ./*.gcov
          gcov build/coverage/*.gcda > /dev/null 2>&1 || true
          mv -f ./*.gcov cov/full/ 2>/dev/null || true
          tail -1 cov/full/run.log

      - name: Analyze + publish report
        run: |
          set -o pipefail
          python3 scripts/fault_coverage.py cov cov/untested-error-paths.txt | tee cov-report.md
          cat cov-report.md >> "$GITHUB_STEP_SUMMARY"
          # Pipeline health gate, calibrated by runs #20/#21: a kind whose
          # forced run died BEFORE the death hooks could dump (or a gcda
          # gcov could not read) legitimately has no data — warn per kind,
          # and hard-fail only when NOTHING produced data (that, and only
          # that, means the pipeline itself is broken). Partial-depth kinds
          # are additionally surfaced via the "under forcing" markers.
          missing=0
          for k in FsyncFail WriteFail WriteShort RenameFail OpenFail DirFsyncFail SegOpenFail FsyncFailAfterPersist; do
            if [ ! -s cov/$k/main.cpp.gcov ]; then
              echo "::warning::no gcov data for $k (forced run died before counters were saved?)"
              missing=$((missing+1))
            fi
            if grep -q 'under forcing' cov/$k/run*.log 2>/dev/null; then
              echo "::warning::$k: suite died early under forcing — coverage PARTIAL for this kind"
            fi
          done
          if [ "$missing" -ge 8 ]; then
            echo "::error::no gcov data for ANY kind — coverage pipeline broken"
            exit 1
          fi

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage-${{ github.run_id }}
          path: |
            cov-report.md
            cov/untested-error-paths.txt
            cov/*/run.log
          if-no-files-found: ignore

  # ---- v29 M1 gate hardening (2026-10-17): self-tests for the arena gate ----
  # The gate that judges the ledger must itself be judged. Runs
  # scripts/test_arena_gate.py: the positive/negative controls for the five
  # hardened gate defects — verify-ledger fixtures (empty / comment-only /
  # stderr-only / missing-file must go red; pristine night green), MISSING-
  # series verdicts (dropped row / deleted TSV / truncated TSV must exit 1),
  # leave-one-out cross-validation structure (the in-sample self-consistency
  # claim it replaces was vacuous by construction), the synthetic
  # regressions (chronokv ops x0.5 must exit 1, x0.95 must stay green), and
  # the half-dead BASELINE legs (a single dropped baseline workload row must
  # fail verify-ledger's calibrated-workload-set comparison and make check
  # REFUSE the affected ratios as BASELINE-GAP with zero REGRESSION verdicts —
  # before the fix it passed the whole gate while the ratio shifted -15.9%,
  # and a truncated rocksdb-sync faked two fillrandom REGRESSIONs) — plus
  # meta-controls that the suite never mutates the bands or the promoted TSVs
  # it judges. Uses only committed fixtures: no runner hardware, no arena run,
  # so it gates EVERY push/PR (unlike the nightly-only arena job). Red here
  # means the arena gate's verdicts are untrustworthy until green again.
  arena-gate-selftest:
    name: arena-gate selftest (controls for the ledger gate)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Gate self-tests (four hardened defects, controls both directions)
        run: python3 scripts/test_arena_gate.py

  # ---- v29 M1 step 4: nightly arena ledger vehicle + regression gate ------
  # Runs the arena (ChronoKV, both durability classes) and the five baseline
  # configs over a FIXED geometry on a fixed-spec runner, and uploads the
  # TSVs (each carries its rule-9 methodology header: hardware, engine
  # versions, geometry, seed, durability class) as an artifact.
  #
  # VEHICLE HISTORY (each step measured, per rule 13):
  #   cbfa94b  one job, 60-min cap.
  #   #62/#65  died identically: ChronoKV legs 44m01s + baselines killed
  #            at >=15m31s — the budget never fit the sequential workload.
  #   e9eb787  split into two PARALLEL jobs (90/180-min caps). Green from
  #            #68 on (31m55s + 15m33s) — but the split put the two legs on
  #            DIFFERENT MACHINES: #75's headers record baselines on
  #            "AMD EPYC 7763" and ChronoKV on "Intel Xeon 6973P-C". The
  #            fairness protocol this ledger exists for says "same harness,
  #            same HARDWARE, methodology written down once and applied
  #            identically" — a cross-engine comparison across two CPUs is
  #            not the product. The split optimized wall-clock and silently
  #            broke comparability; the methodology headers caught it
  #            (which is exactly what rule 9 headers are for).
  #   NOW      re-merged to ONE job (same machine by construction), cap
  #            120 min from the measured sequential need (#65: ~60 min
  #            killed-at-budget; #68 split legs sum ~48 min cross-machine;
  #            120 = >=2x headroom). Artifact name reverts to the original
  #            arena-ledger-<run_id> (the split-era part names never gained
  #            a consumer). GREEN-WEEK CLOCK RESTARTS at the first
  #            completed night on THIS vehicle: nights 1-3 (#68/#74/#75)
  #            ran cross-machine — their per-engine rows stay valid for
  #            same-engine trend (each row carries its own hardware
  #            header), but their cross-engine comparisons are not
  #            same-hardware ledger material, so they do not count toward
  #            the "one green week" acceptance. Rule 9 over sunk nights.
  #
  # GATE ENABLED 2026-10-17, exactly per the recipe this comment used to
  # carry ("adding `arena` to ci-passed needs + committing the calibrated
  # noise bands, after the green week"): the green week completed 7/7
  # (#82/#88/#91/#96/#97/#98/#99, 2026-10-11..17, all success on the
  # re-merged single-job vehicle; rows promoted in-tree under
  # bench/results/promoted/green-week-2026-10-11_17/), the bands were
  # calibrated from those seven nights (bench/arena_bands.json —
  # CALIBRATED, not PROVISIONAL; ratio-normalized primary tier because
  # calibration MEASURED four different runner CPUs across the seven
  # nights: EPYC 9V45 x3 / Xeon 8573C / EPYC 7763 x2 / EPYC 9V74), and
  # `arena` is now in ci-passed's needs (skip-tolerated on push/PR, where
  # this job does not run by design — a flaky shared runner still never
  # blocks a PR; the gate has teeth on the nightly, where "the gate must
  # never learn to be ignored" is the whole point).
  # RE-RUN POLICY (explicit, M1 item 4): a red gate re-runs ONCE via
  # workflow_dispatch on the same commit — ratio bands normalize the CPU
  # lottery but not transient contention; TWO consecutive REGRESSION
  # verdicts are a real regression: bisect, do not re-run.
  # BAND-UPDATE POLICY: bands are recomputed only in a dedicated commit
  # citing the engine change that moved them (M5's writer thread is the
  # planned one; recompute from >= 7 post-change nights), never widened
  # in-flight to silence a red night — the ratchet rule applies to bands.
  # LEDGER PROMOTION RULE (M1 item 5 decision): raw nightly rows live as
  # run artifacts (90-day retention); whenever a milestone CITES ledger
  # rows, that night's TSVs are committed under bench/results/promoted/
  # in the citing commit — citations stay verifiable forever without a
  # bot or nightly commit churn.
  arena:
    name: arena (nightly ledger + regression gate)
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      # Fixed ledger geometry (calibration stage): 200k keys, 100 B values,
      # 4 threads, seed 42. Geometry changes are ledger-format changes —
      # bump the ledger spec, never silently mix geometries.
      ARENA_KEYS: "200000"
      ARENA_OPS: "200000"
      ARENA_THREADS: "4"
      ARENA_SEED: "42"
      ARENA_VALSIZE: "100"
    steps:
      - uses: actions/checkout@v5

      - name: Install baseline libraries (pinned per bench/third_party/versions.txt; distro installs during calibration, recipes recorded for vendoring)
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev liblmdb-dev librocksdb-dev

      - name: Build arena + baselines
        run: make arena arena-baselines

      - name: Run arena — ChronoKV (group + async)
        run: |
          mkdir -p bench/results
          for dur in group async; do
            ./build/arena/arena \
              --keys "$ARENA_KEYS" --ops "$ARENA_OPS" --threads "$ARENA_THREADS" \
              --seed "$ARENA_SEED" --valsize "$ARENA_VALSIZE" --durability "$dur" \
              --dir /tmp/ckv_ledger_"$dur" \
              > "bench/results/chronokv-$dur.tsv" 2>&1 || \
              echo "::warning::arena run chronokv-$dur exited nonzero (the completeness gate below catches missing rows)"
          done

      - name: Run baselines (five configs, identical geometry, SAME machine)
        run: |
          for eng in sqlite-full sqlite-normal lmdb rocksdb-sync rocksdb-tuned; do
            ./build/arena/baselines \
              --engine "$eng" \
              --keys "$ARENA_KEYS" --ops "$ARENA_OPS" --threads "$ARENA_THREADS" \
              --seed "$ARENA_SEED" --valsize "$ARENA_VALSIZE" \
              --dir /tmp/ckv_ledger_base \
              > "bench/results/$eng.tsv" 2>&1 || \
              echo "::warning::baseline run $eng exited nonzero (the completeness gate below catches missing rows)"
          done

      - name: Ledger digest (throughput-only summary in the job log)
        if: always()
        run: |
          for f in bench/results/*.tsv; do
            echo "== $f"
            grep -vE '^#' "$f" | awk -F'\t' '{printf "  %-22s %12s ops/s  p50=%-6s p99=%s\n", $1, $4, $5, $6}'
          done

      - name: Upload ledger artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: arena-ledger-${{ github.run_id }}
          path: bench/results/
          if-no-files-found: warn

      # ---- v29 M1 gate enablement (2026-10-17): the two enforcement steps.
      # Completeness first: the run steps above swallow engine failures into
      # ::warning:: so the digest and artifact still ship for triage — this
      # step is what turns a dead leg into a red job (a crashed arena writes
      # its stderr INTO the tsv, so "file exists" is not "rows exist").
      # HARDENED the same day (gate defect 1): the first cut was a shell
      # grep -c count and was broken two ways, both reproduced with fixtures
      # before the fix — (a) grep -c prints 0 AND exits 1 on zero matches, so
      # `|| echo 0` produced "0\n0" and `[ "$n" -lt 1 ]` died with "integer
      # expression expected" (rc=2), the if-branch never ran, and an EMPTY or
      # comment-only TSV PASSED GREEN; (b) any non-comment line counted, so a
      # TSV containing only crash stderr counted as data rows. The logic now
      # lives in scripts/arena_bands.py `verify-ledger` (>=7 tab-separated
      # fields, numeric ops_per_sec > 0, per engine, missing file = fail),
      # unit-tested with those exact fixtures on every push/PR by the
      # arena-gate-selftest job below.
      - name: Ledger completeness (verify-ledger — valid data rows per engine)
        if: always()
        run: |
          python3 scripts/arena_bands.py verify-ledger --night bench/results

      # The regression verdict: ratio bands (hardware-normalized) + the RSS
      # ratchet-watch (deletechurn = P1's before-column; M3's acceptance
      # tightens WARN to FAIL). Exit 1 = REGRESSION (see the re-run policy
      # in this job's header comment); exit 2 = geometry mismatch — the
      # vehicle drifted from the committed bands and MUST NOT be mixed.
      - name: Regression gate vs calibrated bands (bench/arena_bands.json, 7 green-week nights)
        if: always()
        run: |
          python3 scripts/arena_bands.py check \
            --bands bench/arena_bands.json --night bench/results

  # ---- gate: single aggregate check for branch protection ----------------
  ci-passed:
    name: ci-passed
    needs: [lint, build-shared, engine-tests, tsan, public-api-smoke, dst, crashfuzz, coverage, arena, arena-gate-selftest]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: always()
    steps:
      - name: Check job results
        run: |
          results='${{ toJSON(needs) }}'
          echo "$results" | python3 -c '
          import json, sys
          needs = json.load(sys.stdin)
          # arena runs on schedule/dispatch only; on push/PR it is skipped
          # BY DESIGN and a skip must not fail the aggregate (a flaky
          # shared runner never blocks a PR). Every other job stays strict:
          # only arena gets the skip tolerance.
          failed = [name for name, j in needs.items()
                    if j["result"] != "success"
                    and not (name == "arena" and j["result"] == "skipped")]
          if failed:
              print("FAILED jobs: " + ", ".join(failed))
              sys.exit(1)
          print("All jobs passed: " + ", ".join(needs.keys()))
          '
